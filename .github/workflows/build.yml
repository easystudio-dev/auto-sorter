# Builds the Windows and Linux apps. Push a tag like v1.0.0 to publish them
# as a GitHub Release that non-developers can download.
name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to create the release on tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: AutoSorter-windows.exe
          - os: ubuntu-22.04  # older glibc, so the binary runs on more distros
            asset: AutoSorter-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python test_auto_sorter.py

      - name: Build app
        run: python build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/AutoSorter.exe "${{ matrix.asset }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        # tar keeps the executable bit, which a plain download would lose
        run: tar -czf "${{ matrix.asset }}" -C dist AutoSorter

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
